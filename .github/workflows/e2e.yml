name: E2E (kind + Crossplane)

# The full-fidelity tier: a real kind cluster running real Crossplane, so the
# assertions can catch what nothing else can — that upstream still writes
# composed refs where the walker looks. The envtest tier's CRDs only MIMIC
# XRD-generated ones, so it would keep passing if that shape changed.
#
# DELIBERATELY NOT A REQUIRED CHECK, and it should stay that way. Three external
# registries sit on its critical path (kindest/node, the Crossplane chart,
# xpkg.crossplane.io), none of them ours. As a required check it would block
# Dependabot and release-please PRs harder than a human's, since those cannot be
# re-run by hand as easily.
on:
  schedule:
    # Monday 07:00 UTC — an hour after ci.yml's cron, so a red result here is
    # attributable to this workflow rather than racing the other one.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      crossplane_version:
        description: "Crossplane chart version (empty = chart default)"
        required: false
        default: ""
  pull_request:
    # Opt-in per PR by applying the `e2e` label — for changes that touch the
    # walker, discovery, or the RBAC manifest, where a week-late cron signal is
    # too late to be useful.
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind + Crossplane
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'e2e' }}
    runs-on: ubuntu-latest
    # Generous but bounded: a hung package install should fail, not burn an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: xpmcp-e2e
          wait: 120s

      - name: install Crossplane
        env:
          CHART_VERSION: ${{ inputs.crossplane_version }}
        run: |
          set -euo pipefail
          helm repo add crossplane-stable https://charts.crossplane.io/stable
          helm repo update
          # Retrying SETUP only — never assertions. A flaky registry pull must
          # not be indistinguishable from a real regression.
          for attempt in 1 2 3; do
            if helm install crossplane crossplane-stable/crossplane \
                 --namespace crossplane-system --create-namespace --wait --timeout 5m \
                 ${CHART_VERSION:+--version "$CHART_VERSION"}; then
              break
            fi
            echo "helm install failed (attempt $attempt)"; [ "$attempt" = 3 ] && exit 1
            helm uninstall crossplane -n crossplane-system || true
            sleep 15
          done
          kubectl get deploy -n crossplane-system

      - name: install packages
        run: |
          set -euo pipefail
          kubectl apply -f test/e2e/manifests/00-packages.yaml
          # provider-nop v0.5.0 uses Crossplane v2 "safe start": its NopResource
          # CRD appears once the default ManagedResourceActivationPolicy
          # activates the MRD, so the CRD wait below covers that timing.
          kubectl wait --for=condition=Healthy provider.pkg.crossplane.io/provider-nop --timeout=300s
          kubectl wait --for=condition=Healthy function.pkg.crossplane.io/function-patch-and-transform --timeout=300s
          kubectl wait --for=condition=Established crd/nopresources.nop.crossplane.io --timeout=180s

      - name: apply fixtures (both Crossplane shapes)
        run: |
          set -euo pipefail
          kubectl apply -f test/e2e/manifests/10-platform-v2.yaml
          kubectl apply -f test/e2e/manifests/11-platform-v1.yaml
          # Surface what actually got created before waiting on it: a partially
          # applied multi-doc file (one object rejected, the rest accepted) is
          # otherwise only visible as a downstream wait timeout.
          kubectl get xrd -o custom-columns=NAME:.metadata.name,SCOPE:.spec.scope
          # XRDs must be Established before their instances can be created.
          kubectl wait --for=condition=Established xrd/xstuckapps.example.org --timeout=180s
          kubectl wait --for=condition=Established xrd/xlegacyapps.legacy.example.org --timeout=180s
          kubectl apply -f test/e2e/manifests/20-instance-v2.yaml
          kubectl apply -f test/e2e/manifests/21-instance-v1.yaml
          # The fixtures are deliberately STUCK, so there is no Ready condition
          # to wait on. Wait for the composed resources to carry STATUS instead:
          # existence alone proves composition ran, but a NopResource the
          # provider has not reconciled yet has no conditions at all, and the
          # assertions below are about a resource that is stuck non-Ready — not
          # one that is merely new. Waiting on existence made those two
          # indistinguishable.
          # Require a READY condition specifically, not merely any condition: a
          # Synced-only instant would classify the NopResource healthy and flunk
          # the top-suspect assertion for a reason that has nothing to do with
          # the code under test.
          # This loop MUST fail when it times out rather than falling through.
          # It used to just exhaust: the v1 composition was erroring, only one
          # of the two composed resources ever appeared, and the run carried on
          # to assertions that passed anyway — because an unresolvable ref still
          # counts as a walked node. A wait that gives up quietly turns a broken
          # fixture into a green run.
          ok=0
          for i in $(seq 1 60); do
            n=$(kubectl get nopresources.nop.crossplane.io -A -o json 2>/dev/null \
                  | jq '[.items[] | select(.status.conditions // [] | any(.type == "Ready"))] | length')
            if [ "${n:-0}" -ge 2 ]; then ok=1; break; fi
            sleep 5
          done
          kubectl get nopresources.nop.crossplane.io -A
          if [ "$ok" != 1 ]; then
            echo "::error::only ${n:-0} of 2 composed NopResources became ready."
            echo "Both XRs and their Synced conditions (the composition error, if any):"
            kubectl get xstuckapps,xlegacyapps -A \
              -o custom-columns='KIND:.kind,NAME:.metadata.name,SYNCED:.status.conditions[?(@.type=="Synced")].message'
            exit 1
          fi

      - name: run the diagnostic suite against the cluster
        env:
          CROSSPLANE_E2E: "1"
        run: go -C test/e2e test ./... -run Crossplane -v -timeout 15m

      - name: also verify read-only against the live cluster
        env:
          CROSSPLANE_E2E: "1"
        run: go -C test/e2e test ./... -run ReadOnlyAgainstRealCluster -v -timeout 5m

      # Export the objects upstream ACTUALLY wrote, for use as unit testdata.
      # The reason this exists: a hand-written fixture encodes what its author
      # believes a provider emits, and this repo has now shipped one bug from
      # exactly that gap — every fixture here set a condition reason, while real
      # provider-nop writes Ready=False with neither reason nor message, so the
      # top-ranked suspect came back with no explanation and no unit test could
      # have caught it. Golden objects captured from a live cluster let the fast
      # per-PR suite run against real shapes instead of imagined ones.
      #
      # Runs on success only: fixtures captured from a broken cluster would
      # enshrine the breakage as the expected shape.
      - name: export golden fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/golden
          kubectl get xstuckapps.example.org demo -n default -o json > /tmp/golden/v2-xr.json
          kubectl get legacyappclaims.legacy.example.org legacy-demo -n default -o json \
            > /tmp/golden/v1-claim.json
          kubectl get xlegacyapps.legacy.example.org -o json > /tmp/golden/v1-xr-list.json
          kubectl get nopresources.nop.crossplane.io -A -o json > /tmp/golden/composed-list.json
          kubectl get providers.pkg.crossplane.io,functions.pkg.crossplane.io -o json \
            > /tmp/golden/packages-list.json
          kubectl version -o json > /tmp/golden/versions.json
          # The one line that matters most, echoed into the log so a reader sees
          # the shape without downloading anything.
          jq -r '.items[] | "\(.kind)/\(.metadata.name): \(.status.conditions // [] | map("\(.type)=\(.status) reason=\"\(.reason // "")\"") | join(" "))"' \
            /tmp/golden/composed-list.json
      - name: upload golden fixtures
        uses: actions/upload-artifact@v7
        with:
          name: golden-fixtures
          path: /tmp/golden

      # A failure a week after the fact is only actionable with the cluster's
      # own account of what happened.
      - name: collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/e2e-logs
          kind export logs /tmp/e2e-logs --name xpmcp-e2e || true
          kubectl get all -A -o wide > /tmp/e2e-logs/all-resources.txt 2>&1 || true
          kubectl get xrd,composition,provider,function -A -o yaml > /tmp/e2e-logs/crossplane.yaml 2>&1 || true
          # The XRs and the resources they compose — i.e. the objects the
          # assertions actually read. Without these a failure about a suspect's
          # conditions cannot be diagnosed from the artifact at all, which is
          # how the first real failure here left two candidate root causes
          # indistinguishable a week after the fact.
          kubectl get xstuckapps,xlegacyapps,legacyappclaims -A -o yaml \
            > /tmp/e2e-logs/composites.yaml 2>&1 || true
          kubectl get nopresources.nop.crossplane.io -A -o yaml \
            > /tmp/e2e-logs/composed.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > /tmp/e2e-logs/events.txt 2>&1 || true
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cluster-logs
          path: /tmp/e2e-logs
          if-no-files-found: ignore

  # The native-readiness tier. Separate from the job above on purpose: it needs a
  # real kube-controller-manager and kubelet but NOT Crossplane, so kindest/node
  # and one pause image are its only external dependencies — none of the three
  # registries that force the Crossplane job onto a weekly cadence. That makes it
  # a candidate for running on every PR later; it is kept on the same triggers
  # for now rather than widening CI unilaterally.
  #
  # What it establishes: that internal/xp/native.go's rules match what upstream
  # controllers really write. Unit tests assert against conditions this repo
  # authored, so they only prove the rules read their own fixtures back.
  native:
    name: kind (native readiness)
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'e2e' }}
    runs-on: ubuntu-latest
    # Comfortably above the test's own 20m timeout plus setup. If the JOB times
    # out the run is cancelled and the if: failure() diagnostics never execute,
    # so the budget must let the test fail on its own terms first.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: xpmcp-native
          wait: 120s

      # Preloaded so the recovery half of the rollout probe resolves the image
      # locally. Without this the fixed rollout races its own 15s progress
      # deadline against a registry pull, and a timing flake would be
      # indistinguishable from the real finding the probe exists to report.
      - name: preload the probe image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull registry.k8s.io/pause:3.10; then break; fi
            echo "pull failed (attempt $attempt)"; [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          kind load docker-image registry.k8s.io/pause:3.10 --name xpmcp-native

      - name: probe native readiness against real controllers
        env:
          CLUSTER_E2E: "1"
        run: go -C test/e2e test ./... -run NativeReadiness -v -timeout 20m

      - name: collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/native-logs
          kubectl get deploy,rs,pod -A -o wide > /tmp/native-logs/workloads.txt 2>&1 || true
          kubectl get deploy -A -o yaml > /tmp/native-logs/deployments.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > /tmp/native-logs/events.txt 2>&1 || true
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-readiness-logs
          path: /tmp/native-logs
          if-no-files-found: ignore

  # ci.yml's notifier only watches ci.yml. Without this, a red weekly e2e run is
  # exactly as invisible as the red govulncheck run that sat unnoticed for 11
  # days — the failure mode this repo has already had once.
  notify-scheduled-failure:
    name: notify on scheduled failure
    needs: [kind, native]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled E2E (kind) is failing"
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            "The weekly kind e2e run failed. Check the run to see which job:" \
            "" \
            "Run: ${RUN_URL} (cluster logs are attached to it as an artifact)" \
            "" \
            "kind + Crossplane — most likely a package version drifted on the" \
            "marketplace or the chart changed; only 'upstream moved composed refs'" \
            "is a bug in this repo. Check the artifact before assuming." \
            "" \
            "kind (native readiness) — far more likely to be real. Its only external" \
            "dependencies are kindest/node and the pause image, so a failure here" \
            "usually means upstream changed how a controller writes status and" \
            "internal/xp/native.go encodes the old shape." \
            "" \
            "This issue is reused rather than reopened weekly.")
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
