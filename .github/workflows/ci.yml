name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mon 06:00 UTC): re-run CI — chiefly govulncheck — so a stdlib CVE
    # disclosed while the repo is quiet is caught, not just on the next push/PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build golangci-lint from source with the runner's Go toolchain rather
      # than using a prebuilt binary: golangci-lint refuses to run when the Go
      # version it was built with is older than go.mod's (here go 1.26).
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      # Guards one specific mistake that is invisible in review and, because the
      # affected jobs only run on failure, invisible in CI too: a `gh` call in a
      # job with no repository context. Both notifiers shipped that way and
      # neither ever ran. Cheap, and it runs on every PR — unlike the jobs it
      # protects.
      - name: workflows declare a repo for gh
        run: python3 .github/scripts/check-gh-context.py

  # Real kube-apiserver + etcd (envtest), no controllers. Covers what the unit
  # fakes structurally cannot: discovery caching and invalidation, the
  # involvedObject.uid field selector (dynamicfake ignores field selectors
  # entirely), Crossplane discovery categories over the real aggregated-discovery
  # wire, and both v1 and v2 composed-ref tree shapes against an apiserver that
  # actually stores and serves the objects.
  #
  # NOT in the branch ruleset's required checks on purpose. It is deliberately
  # allowed to burn in for a while first: a new check promoted straight to
  # required blocks every merge on its first flake, and under strict required
  # checks every push to main then forces a re-run across all open PRs.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The apiserver/etcd tarball is ~60MB and version-pinned, so it is worth
      # caching; a miss just re-downloads rather than failing.
      - name: cache envtest binaries
        uses: actions/cache@v6
        with:
          path: bin/envtest
          key: envtest-${{ runner.os }}-1.36.2
      - name: integration tests (envtest)
        run: make e2e-envtest

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The weekly cron above is the tripwire for a CVE disclosed while the repo is
  # quiet — it worked, finding a reachable x/text advisory. Nobody was told, so
  # main sat red for 11 days with PRs stuck behind it. Detection was never the
  # gap; notification was.
  #
  # Scheduled runs only: a push/PR failure already has someone watching it, and
  # GitHub's own notifications for cron runs go to whoever last touched the
  # workflow file, which is nobody in particular.
  # Delegates to the single shared implementation. It lived inline here and in
  # e2e.yml as near-identical copies, which is how the same `gh` bug existed in
  # two places and was fixed twice. The shared workflow also self-tests, so this
  # path is exercised without waiting for a real emergency.
  notify-scheduled-failure:
    name: notify on scheduled failure
    needs: [build-test, lint, integration, govulncheck]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      title: "Scheduled CI is failing on main"
      intro: >-
        The weekly scheduled CI run failed on `main`. This job only fires for
        `schedule` events, so the most likely cause is a newly disclosed
        vulnerability reaching `govulncheck` — the reason the cron exists —
        rather than anything a commit changed.
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
