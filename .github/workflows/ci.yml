name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly (Mon 06:00 UTC): re-run CI — chiefly govulncheck — so a stdlib CVE
    # disclosed while the repo is quiet is caught, not just on the next push/PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build golangci-lint from source with the runner's Go toolchain rather
      # than using a prebuilt binary: golangci-lint refuses to run when the Go
      # version it was built with is older than go.mod's (here go 1.26).
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The weekly cron above is the tripwire for a CVE disclosed while the repo is
  # quiet — it worked, finding a reachable x/text advisory. Nobody was told, so
  # main sat red for 11 days with PRs stuck behind it. Detection was never the
  # gap; notification was.
  #
  # Scheduled runs only: a push/PR failure already has someone watching it, and
  # GitHub's own notifications for cron runs go to whoever last touched the
  # workflow file, which is nobody in particular.
  notify-scheduled-failure:
    name: notify on scheduled failure
    needs: [build-test, lint, govulncheck]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled CI is failing on main"
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            "The weekly scheduled CI run failed on \`main\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "This job only fires for \`schedule\` events. The most likely cause is a" \
            "newly disclosed vulnerability reaching \`govulncheck\` — the reason the" \
            "cron exists — rather than anything a commit changed." \
            "" \
            "This issue is reused rather than reopened weekly; it will keep collecting" \
            "comments until the run goes green and someone closes it.")
          # Match on title rather than a label so the workflow carries no
          # dependency on repo labels existing.
          existing=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == env.TITLE)][0].number // empty")
          if [ -n "${existing}" ]; then
            echo "commenting on existing issue #${existing}"
            gh issue comment "${existing}" --body "${body}"
          else
            echo "opening a new tracking issue"
            gh issue create --title "${TITLE}" --body "${body}"
          fi
