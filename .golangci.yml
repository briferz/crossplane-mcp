# golangci-lint v2 configuration.
# The default linters (errcheck, govet, ineffassign, staticcheck, unused) are
# enabled implicitly; the list below adds a few high-signal, low-noise ones.
version: "2"

linters:
  enable:
    - misspell
    - unconvert
    - gosec
    - bodyclose
    - forbidigo
    - revive
    - gocyclo
  settings:
    gocyclo:
      # Reports functions ABOVE this. golangci's default is 30 (and nothing here
      # reached it); Go Report Card uses 15. 20 is where splitting paid for
      # itself: Diagnose/BuildPackages (30) and skewSentences (23) were split
      # into named helpers, while the 16-18s -- the parallel-walk window, the
      # discovery lookup, the TF blob decoder, BuildUnhealthy -- read as one
      # piece and were left alone.
      min-complexity: 20
    forbidigo:
      # Match the type-checked identity of the call rather than the source text:
      # a plain regex would fire on strings.Replace / gzip.NewReader and would
      # miss a write issued through a stored interface variable.
      analyze-types: true
      forbid:
        # The read-only invariant (CLAUDE.md hard rule 1), mechanically enforced.
        # Both interfaces are listed on purpose: Resource(gvr).Create resolves to
        # NamespaceableResourceInterface while Resource(gvr).Namespace(ns).Create
        # resolves to ResourceInterface, so dropping the alternation would
        # silently miss the cluster-scoped form.
        #
        # Scope, honestly: this covers writes through k8s.io/client-go/dynamic
        # only. A typed clientset, a raw rest.Client, or a call routed through a
        # locally-declared wrapper interface (which gives the call the local
        # type's identity) would not be caught. Nothing here does any of those,
        # and TestHandlersIssueOnlyReadVerbs is the backstop for anything routed
        # through Client.Dyn -- the only cluster handle that exists today.
        #
        # Re-verify after a client-go bump. This is a DENYLIST of the eight write
        # methods, so it fails open twice: a renamed or relocated interface stops
        # matching silently, and a newly added write method is not covered at
        # all. An allowlist inversion (anything but Get/List/Watch) is not
        # expressible -- forbidigo uses RE2, which has no lookahead.
        - pattern: '^dynamic\.(Namespaceable)?ResourceInterface\.(Create|Update|UpdateStatus|Delete|DeleteCollection|Patch|Apply|ApplyStatus)$'
          pkg: '^k8s\.io/client-go/dynamic$'
          msg: "crossplane-mcp is read-only: only get/list/watch may ever be issued against the cluster (CLAUDE.md hard rule 1)."
  exclusions:
    rules:
      # A test's branches are its assertions (if got != want { t.Errorf }), so
      # cyclomatic complexity measures how much it checks, not how hard it is to
      # follow.
      - path: _test\.go
        linters:
          - gocyclo
