# CRDs shaped like the ones a Crossplane XRD generates: the discovery
# categories Crossplane stamps (composite / claim / managed), a status
# subresource, and preserve-unknown-fields so a test can write arbitrary
# resourceRefs and conditions without a schema to maintain.
#
# These stand in for XRD-generated CRDs because envtest runs no controllers, so
# no XRD would ever be reconciled into a CRD. Fidelity is checked the other way
# round: the kind + real-Crossplane tier (e2e.yml) walks genuinely generated
# CRDs, and that is the tier that would catch upstream changing this shape.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xapps.apps.example.org
spec:
  group: apps.example.org
  names:
    kind: XApp
    listKind: XAppList
    plural: xapps
    singular: xapp
    categories: [composite]
  # Crossplane v2: XRs are namespaced and nest machinery under spec.crossplane.
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xclusters.legacy.example.org
spec:
  group: legacy.example.org
  names:
    kind: XCluster
    listKind: XClusterList
    plural: xclusters
    singular: xcluster
    categories: [composite]
  # Crossplane v1 / LegacyCluster: cluster-scoped XR, refs at spec.resourceRefs.
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nopresources.nop.example.org
spec:
  group: nop.example.org
  names:
    kind: NopResource
    listKind: NopResourceList
    plural: nopresources
    singular: nopresource
    categories: [managed]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
