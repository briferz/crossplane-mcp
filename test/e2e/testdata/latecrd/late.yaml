# Installed DELIBERATELY LATE, after the server's discovery cache has already
# populated — the mid-session provider-install / new-XRD case.
#
# The memory discovery cache never expires and the deferred RESTMapper's own
# reset is gated on !Fresh(), permanently false once populated, so without an
# explicit invalidate this kind stays invisible until the process restarts.
# internal/k8s/invalidate_test.go models that with a hand-written stub; this is
# the same path against a real apiserver, a real memcache, and a real mapper.
apiVersion: apiextensions.k8s.io/v1
