metadata:
  name: latecomers.late.example.org
spec:
  group: late.example.org
  names:
    kind: Latecomer
    listKind: LatecomerList
    plural: latecomers
    singular: latecomer
    categories: [managed]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
